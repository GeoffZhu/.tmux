##### 基础 #####

# prefix 改为 Ctrl+x
set -g prefix C-x
unbind C-a
bind C-x send-prefix

# 鼠标支持
set -g mouse on

# 支持现代组合键
set -g extended-keys on
set -g extended-keys-format csi-u

# copy mode 使用默认键位（emacs）
setw -g mode-keys emacs

# 保留鼠标滚动/选择能力；鼠标选择后直接复制到 Mac 剪贴板并保留选区
unbind -T copy-mode-vi MouseDown1Pane
bind -T copy-mode-vi MouseDown1Pane send-keys -X clear-selection
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy" \; display-message -d 500 "  copyed"
unbind -T copy-mode-vi DoubleClick1Pane
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.1 \; send-keys -X copy-pipe-no-clear "pbcopy" \; send-keys -X stop-selection \; send-keys -X next-word-end \; display-message -d 500 "  copyed"
unbind -T copy-mode MouseDown1Pane
bind -T copy-mode MouseDown1Pane send-keys -X clear-selection
unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy" \; display-message -d 500 "  copyed"
unbind -T copy-mode DoubleClick1Pane
bind -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.1 \; send-keys -X copy-pipe-no-clear "pbcopy" \; send-keys -X stop-selection \; send-keys -X next-word-end \; display-message -d 500 "  copyed"
unbind -T root DoubleClick1Pane
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.1 ; send-keys -X copy-pipe-no-clear "pbcopy" ; send-keys -X stop-selection ; send-keys -X next-word-end ; display-message -d 500 "  copyed" }

# 提高历史 scrollback
set -g history-limit 100000

# 关闭 pane 滚动条，避免常驻占位列
set -g pane-scrollbars off

# pane 间只保留低对比度单线分割
set -g pane-border-lines single
set -g pane-border-style fg=colour244,bg=default
set -g pane-active-border-style fg=colour244,bg=default
set -g pane-border-indicators off

# Prefix + ←/↓/↑/→ 按方向分屏
bind Left split-window -h -b
bind Down split-window -v
bind Up split-window -v -b
bind Right split-window -h

# Option + ←/↓/↑/→ 在 pane 间切换 focus
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

##### pane resize #####

# 使用 Prefix + Ctrl + 方向键调整 pane 大小
bind -r C-Left resize-pane -L 5
bind -r C-Down resize-pane -D 5
bind -r C-Up resize-pane -U 5
bind -r C-Right resize-pane -R 5

# Option + Shift + ←/↓/↑/→ 调整 pane 大小
bind -n -r M-S-Left resize-pane -L 5
bind -n -r M-S-Down resize-pane -D 5
bind -n -r M-S-Up resize-pane -U 5
bind -n -r M-S-Right resize-pane -R 5

##### window #####

# 新 window
bind c new-window

# window 切换
bind n next-window
bind p previous-window

##### session #####

# session 选择器
bind S choose-session

##### pane 关闭 #####

# Prefix + q 直接关闭当前 pane
unbind x
unbind q
bind q kill-pane

##### reload config #####

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

##### 状态栏 #####

set -g status-position bottom
set -g status 2
set -g status-bg default
set -g status-fg white
set -g status-style bg=default,fg=white
set -g status-left-style bg=default,fg=white
set -g status-right-style bg=default,fg=white
set -g status-interval 1
set -g status-left-length 200
set -g status-right-length 0
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-status-separator ""
set -g status-format[0] ""
set -g status-format[1] "#[align=left]#{T;=/#{status-left-length}:status-left}"

set -g status-left "#{?client_prefix,#[bg=yellow]#[fg=black]#[bold] C-x #[default] #[fg=white] ←↓↑→: split   d: detach   q: close,#{?@shared,#[fg=green] shared #[fg=cyan],#[fg=cyan]  }#{pane_current_path}}"

##### Mac clipboard #####

bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "pbcopy"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
